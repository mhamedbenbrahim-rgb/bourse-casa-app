name: Mise à jour quotidienne OPCVM (ASFIM)

on:
  schedule:
    # TouTES LES HEURES h00 UTC (après la publication ASFIM du soir)
    - cron: "0 * * * *"
  workflow_dispatch:      # permet aussi le lancement manuel depuis GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests openpyxl

      - name: Vérifier et récupérer les nouveaux tableaux ASFIM
        run: python opcvm_scraper.py --db opcvm.db

      - name: Committer la base mise à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opcvm.db
          git diff --cached --quiet || git commit -m "MAJ tableaux de performances OPCVM $(date +'%Y-%m-%d')"
          git push
